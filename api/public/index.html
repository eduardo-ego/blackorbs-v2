<!doctype html>
<html lang="en">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Panel</title>
<style>
:root {
  color-scheme: dark;
  --bg: #08090c;
  --bg-glow-1: #1c1543;
  --bg-glow-2: #082832;
  --surface-1: rgba(255,255,255,0.035);
  --surface-2: rgba(255,255,255,0.05);
  --text-primary: #eef0f4;
  --text-secondary: #a3a8b4;
  --text-muted: #6c7080;
  --border: rgba(255,255,255,0.09);
  --shadow-dark: rgba(0,0,0,0.55);
  --shadow-light: rgba(255,255,255,0.04);
  --good: #2fd35b;
  --warning: #fbb63e;
  --serious: #ff8c5c;
  --critical: #ff5470;
  --blue: #4d8dff;
  --violet: #8b6bf2;
  --magenta: #ef7fc0;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  gap: 24px; padding: 32px 16px;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: -10%; z-index: -1;
  background:
    radial-gradient(circle at 15% 20%, var(--bg-glow-1), transparent 45%),
    radial-gradient(circle at 85% 75%, var(--bg-glow-2), transparent 50%),
    var(--bg);
  filter: blur(70px);
  opacity: .5;
}
.ring-panel {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  width: min(320px, 90vw); padding: 12px 0;
}
.orb-wrap { width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; position: relative; }
.ring-halo, .ring-main {
  position: absolute;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--blue), var(--violet) 35%, var(--blue) 55%, var(--magenta) 78%, var(--blue) 100%);
}
.ring-halo {
  inset: 0;
  mask-image: radial-gradient(circle, transparent 44%, black 60%, transparent 80%);
  -webkit-mask-image: radial-gradient(circle, transparent 44%, black 60%, transparent 80%);
  filter: blur(22px);
  opacity: .55;
  animation: ring-flow-rev 9s linear infinite;
}
.ring-main {
  inset: 35px;
  mask-image: radial-gradient(circle, transparent 58%, black 64%, black 100%);
  -webkit-mask-image: radial-gradient(circle, transparent 58%, black 64%, black 100%);
  filter: blur(3px);
  animation: ring-flow 7s linear infinite;
}
.ring-pulse { position: absolute; inset: 35px; border-radius: 50%; border: 1.5px solid transparent; opacity: 0; }
@keyframes ring-flow { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.05); } 100% { transform: rotate(360deg) scale(1); } }
@keyframes ring-flow-rev { 0% { transform: rotate(360deg) scale(1.03); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(0deg) scale(1.03); } }

.robot[data-mood="thinking"] .ring-halo, .robot[data-mood="thinking"] .ring-main {
  background: conic-gradient(from 0deg, var(--violet), var(--blue) 30%, var(--magenta) 60%, var(--violet) 100%);
}
.robot[data-mood="thinking"] .ring-main { animation-duration: 2.2s; }
.robot[data-mood="thinking"] .ring-halo { animation-duration: 3s; }

.robot[data-mood="attention"] .ring-halo, .robot[data-mood="attention"] .ring-main {
  background: conic-gradient(from 0deg, var(--warning), var(--serious) 40%, var(--warning) 70%, var(--serious) 100%);
}
.robot[data-mood="attention"] .ring-main { animation-duration: 1.6s; }
.robot[data-mood="attention"] .ring-halo { animation-duration: 2.4s; }

.robot[data-mood="critical"] .ring-halo, .robot[data-mood="critical"] .ring-main {
  background: conic-gradient(from 0deg, var(--critical), var(--serious) 30%, var(--critical) 60%, var(--serious) 100%);
}
.robot[data-mood="critical"] .ring-main { animation-duration: .8s; }
.robot[data-mood="critical"] .ring-halo { animation-duration: 1.2s; }
.robot[data-mood="critical"] .ring-pulse {
  border-color: color-mix(in srgb, var(--critical) 65%, transparent);
  animation: ring-pulse-out 1s ease-out infinite;
}
@keyframes ring-pulse-out { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.4); opacity: 0; } }

.robot[data-mood="happy"] .ring-halo, .robot[data-mood="happy"] .ring-main {
  background: conic-gradient(from 0deg, var(--good), var(--blue) 40%, var(--good) 70%, var(--blue) 100%);
}
.robot[data-mood="happy"] .ring-main { animation-duration: 6s; }
.robot[data-mood="happy"] .ring-halo { animation-duration: 8s; }

.mood-label { margin: 0; font-size: 15px; font-weight: 650; text-align: center; }
.tag { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
.readings { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); }
.readings b { color: var(--text-primary); font-size: 16px; display: block; }
.forecast { font-size: 12px; color: var(--text-muted); text-align: center; }

.chat-panel {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  width: min(480px, 92vw); padding: 12px 0;
}
.chat-log {
  width: 100%; height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  padding: 12px; border-radius: 16px;
  background: rgba(0,0,0,0.18);
  box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
}
.msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; font-size: 13px; line-height: 1.45; }
.msg.user {
  align-self: flex-end; color: white;
  background: linear-gradient(145deg, var(--blue), var(--violet));
  box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 6px rgba(255,255,255,0.06);
}
.msg.assistant {
  align-self: flex-start; color: var(--text-primary);
  background: rgba(255,255,255,0.045);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
}
.chat-form { display: flex; gap: 10px; width: 100%; }
.chat-form input {
  flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid transparent;
  font-size: 13px; color: var(--text-primary);
  background: rgba(0,0,0,0.2);
  box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light);
}
.chat-form input::placeholder { color: var(--text-muted); }
.chat-form input:focus { outline: none; border-color: rgba(139,107,242,0.5); }
.chat-form button {
  padding: 10px 16px; border-radius: 12px; border: none; color: white; font-size: 13px; cursor: pointer;
  background: linear-gradient(145deg, var(--violet), #6a4fd6);
  box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 6px rgba(255,255,255,0.06);
}
.chat-form button:active { box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4); }
.chat-form button:disabled { opacity: .5; cursor: default; box-shadow: none; }
.chat-toolbar { display: flex; align-items: center; justify-content: flex-end; width: 100%; margin-bottom: 2px; }
.voice-toggle {
  width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-muted); background: rgba(0,0,0,0.2);
  box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
}
.voice-toggle svg { width: 14px; height: 14px; }
.voice-toggle.active { color: var(--good); }

.provider-fab {
  position: fixed; top: 16px; left: 16px; z-index: 10;
  width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--text-secondary);
  background: linear-gradient(145deg, var(--surface-2), var(--surface-1));
  backdrop-filter: blur(14px);
  box-shadow: 5px 5px 12px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  transition: color .15s;
}
.provider-fab[data-provider="openai"] { color: #6fe0c9; }
.provider-fab[data-provider="claude"] { color: #e8a37f; }

.graficas-fab {
  position: fixed; bottom: 16px; left: 16px; z-index: 10;
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); text-decoration: none;
  background: linear-gradient(145deg, var(--surface-2), var(--surface-1));
  backdrop-filter: blur(14px);
  box-shadow: 5px 5px 12px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  transition: color .15s;
}
.graficas-fab:hover { color: var(--blue); }
.graficas-fab svg { width: 16px; height: 16px; }

.forecast-confianza { font-size: 10.5px; color: var(--text-muted); }
.forecast-confianza.high { color: var(--good); }
.forecast-confianza.low { color: var(--warning); }

.normalidad-fab {
  position: fixed; top: 16px; right: 16px; z-index: 10;
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, var(--surface-2), var(--surface-1));
  backdrop-filter: blur(14px);
  box-shadow: 5px 5px 12px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
}
.normalidad-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.normalidad-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 3; }
.normalidad-ring {
  fill: none; stroke: var(--good); stroke-width: 3; stroke-linecap: round;
  stroke-dasharray: 97.4; stroke-dashoffset: 97.4;
  transition: stroke-dashoffset .6s ease, stroke .6s ease;
}
.normalidad-text { position: relative; font-size: 10.5px; font-weight: 700; color: var(--text-primary); }
</style>
</head>
<body>

<button type="button" id="provider-fab" class="provider-fab" data-provider="openai" title="Chat provider: OpenAI">O</button>

<a href="/graficas.html" class="graficas-fab" title="View charts and history">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="20" x2="18" y2="10"></line>
    <line x1="12" y1="20" x2="12" y2="4"></line>
    <line x1="6" y1="20" x2="6" y2="14"></line>
  </svg>
</a>

<div id="normalidad-fab" class="normalidad-fab" title="Normality: --">
  <svg viewBox="0 0 36 36" class="normalidad-svg">
    <circle class="normalidad-track" cx="18" cy="18" r="15.5"></circle>
    <circle class="normalidad-ring" id="normalidad-ring" cx="18" cy="18" r="15.5"></circle>
  </svg>
  <span class="normalidad-text" id="normalidad-value">--</span>
</div>

<div class="ring-panel">
  <span class="tag" id="tag">happy</span>
  <div class="robot" id="robot" data-mood="idle">
    <div class="orb-wrap"><div class="ring-halo"></div><div class="ring-main"></div><div class="ring-pulse"></div></div>
  </div>
  <p class="mood-label" id="mood-label">connecting...</p>
  <div class="readings">
    <div>Temp<b id="r-temp">--</b></div>
    <div>Humidity<b id="r-hum">--</b></div>
  </div>
  <p class="forecast" id="ultima-hora"></p>
  <p class="forecast" id="forecast"></p>
  <span class="forecast-confianza" id="forecast-confianza"></span>
</div>

<div class="chat-panel">
  <span class="tag">chat</span>
  <div class="chat-toolbar">
    <button type="button" id="voice-toggle" class="voice-toggle active" title="Voice response">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
    </button>
  </div>
  <div class="chat-log" id="chat-log"></div>
  <form class="chat-form" id="chat-form">
    <input id="chat-input" type="text" placeholder="Type your question..." autocomplete="off">
    <button type="submit" id="chat-send">Send</button>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const robot = document.getElementById('robot');
const tag = document.getElementById('tag');
const moodLabel = document.getElementById('mood-label');
const forecastEl = document.getElementById('forecast');
const rTemp = document.getElementById('r-temp');
const rHum = document.getElementById('r-hum');
const normalidadFab = document.getElementById('normalidad-fab');
const normalidadRing = document.getElementById('normalidad-ring');
const normalidadValue = document.getElementById('normalidad-value');
const forecastConfianza = document.getElementById('forecast-confianza');
const NORMALIDAD_CIRCUNFERENCIA = 2 * Math.PI * 15.5;

let estadoActual = 'happy';

function setMood(mood, label) {
  robot.dataset.mood = mood;
  tag.textContent = mood;
  if (label) moodLabel.textContent = label;
}

function colorNormalidad(pct) {
  if (pct >= 80) return 'var(--good)';
  if (pct >= 50) return 'var(--warning)';
  return 'var(--critical)';
}

function pintarEstadoMl(estado) {
  estadoActual = estado.mood || 'happy';
  setMood(estadoActual, estado.message);

  if (estado.forecast_temperature != null) {
    forecastEl.textContent = `In ~${estado.forecast_horizon_minutes} min: ${estado.forecast_temperature}°C, ${estado.forecast_humidity}% humidity`;
  }

  if (estado.normalidad_pct != null) {
    const pct = estado.normalidad_pct;
    const offset = NORMALIDAD_CIRCUNFERENCIA * (1 - pct / 100);
    normalidadRing.style.strokeDashoffset = offset;
    normalidadRing.style.stroke = colorNormalidad(pct);
    normalidadValue.textContent = `${Math.round(pct)}%`;
    normalidadFab.title = `Normality: ${pct}% — ${estado.message || ''}`;
  }

  if (estado.forecast_confianza) {
    forecastConfianza.textContent = `Forecast: confidence ${estado.forecast_confianza}`;
    forecastConfianza.className = `forecast-confianza ${estado.forecast_confianza}`;
  }
}

const ultimaHoraEl = document.getElementById('ultima-hora');
const ZONA_HORARIA = 'America/Mexico_City';

function pintarLectura(d) {
  rTemp.textContent = `${d.temperature}°C`;
  rHum.textContent = `${d.humidity}%`;
  if (d.timestamp) {
    const hora = new Date(d.timestamp).toLocaleTimeString('en-US', {
      timeZone: ZONA_HORARIA, hour: '2-digit', minute: '2-digit',
    });
    ultimaHoraEl.textContent = `Last reading: ${hora}`;
  }
}

fetch('/ml/state').then(r => r.json()).then(pintarEstadoMl).catch(() => {});
fetch('/data?limit=1').then(r => r.json()).then(rows => { if (rows[0]) pintarLectura(rows[0]); }).catch(() => {});

const socket = io();
socket.on('mlUpdate', pintarEstadoMl);
socket.on('newData', pintarLectura);
socket.on('chatMood', (m) => setMood(m.mood, m.mood === 'thinking' ? 'thinking...' : null));

const chatLog = document.getElementById('chat-log');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');

let providerActivo = 'openai';
const providerFab = document.getElementById('provider-fab');
const PROVIDER_LABELS = { openai: { letra: 'O', nombre: 'OpenAI' }, claude: { letra: 'C', nombre: 'Claude' } };

providerFab.addEventListener('click', () => {
  providerActivo = providerActivo === 'openai' ? 'claude' : 'openai';
  const info = PROVIDER_LABELS[providerActivo];
  providerFab.dataset.provider = providerActivo;
  providerFab.textContent = info.letra;
  providerFab.title = `Chat provider: ${info.nombre}`;
});

const ICONO_SONIDO_ON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
</svg>`;
const ICONO_SONIDO_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
  <line x1="23" y1="9" x2="17" y2="15"></line>
  <line x1="17" y1="9" x2="23" y2="15"></line>
</svg>`;

let vozActiva = true;
const voiceToggle = document.getElementById('voice-toggle');
voiceToggle.addEventListener('click', () => {
  vozActiva = !vozActiva;
  voiceToggle.classList.toggle('active', vozActiva);
  voiceToggle.innerHTML = vozActiva ? ICONO_SONIDO_ON : ICONO_SONIDO_OFF;
  voiceToggle.title = vozActiva ? 'Voice response (on)' : 'Voice response (off)';
  if (!vozActiva) window.speechSynthesis.cancel();
});

function hablar(texto) {
  if (!vozActiva || !texto) return;
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'en-US';
    window.speechSynthesis.speak(utterance);
  } catch (err) {
    console.error('Error generating voice:', err);
  }
}

function agregarMensaje(texto, autor) {
  const div = document.createElement('div');
  div.className = `msg ${autor}`;
  div.textContent = texto;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const mensaje = chatInput.value.trim();
  if (!mensaje) return;
  agregarMensaje(mensaje, 'user');
  chatInput.value = '';
  chatSend.disabled = true;
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: mensaje, provider: providerActivo }),
    });
    const data = await resp.json();
    const texto = data.result || data.error || 'Sin respuesta';
    agregarMensaje(texto, 'assistant');
    hablar(texto);
  } catch (err) {
    agregarMensaje('Connection error with the server.', 'assistant');
  } finally {
    chatSend.disabled = false;
  }
});
</script>
</body>
</html>
